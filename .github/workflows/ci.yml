name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Build is verified by the Vercel preview deployment on every PR, so it is
      # intentionally not duplicated here (it requires NEXT_PUBLIC_CONVEX_URL +
      # Clerk keys for build-time generateStaticParams data fetching).
      #
      # Lint is not yet a gate: `npm run lint` currently reports pre-existing
      # errors (mostly no-explicit-any) tracked under Convex Hardening in prd.md.
      # Add a `npm run lint` step here once those are resolved.
