name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bun is the package manager/runner; Node stays the runtime that actually
      # executes tsc/next/convex/vitest (we never pass --bun), so pin both.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

  typecheck-fast:
    name: Typecheck (tsgo, informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bunx tsgo --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      # Build is verified by the Vercel preview deployment on every PR, so it is
      # intentionally not duplicated here (it requires NEXT_PUBLIC_CONVEX_URL +
      # Clerk keys for build-time generateStaticParams data fetching).
      #
      # Lint is not yet a gate: `bun run lint` currently reports pre-existing
      # errors (mostly no-explicit-any) tracked under Convex Hardening in prd.md.
      # Add a `bun run lint` step here once those are resolved.
