name: Claude Review

# Paused by default. Set the repository variable CLAUDE_REVIEW_ENABLED=true to enable:
# 1. INITIAL - once when a PR is opened, reopened, or marked ready. It does not
#    rerun for every commit because `synchronize` is intentionally omitted.
# 2. FINAL - on demand when someone mentions @claude on the PR. This run reads
#    prior review comments and current commits before doing a final pass.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      vars.CLAUDE_REVIEW_ENABLED == 'true' && (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}

      - name: Run Claude review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
            MODE: ${{ github.event_name == 'pull_request' && 'INITIAL (automatic review on PR open)' || 'FINAL (re-check requested via @claude)' }}

            Review this Next.js, React, and Convex pull request. Read AGENTS.md and
            the full touched files before reporting findings.

            In INITIAL mode, review the complete PR diff once.

            In FINAL mode, first gather the prior conversation, inline comments,
            commits, and current diff:
            - `gh pr view <PR> --comments`
            - `gh api repos/${{ github.repository }}/pulls/<PR>/comments`
            - `gh pr view <PR> --json commits`
            - `gh pr diff <PR>`

            Then verify whether earlier findings were addressed, inspect what changed,
            and do a final holistic pass. Do not repeat resolved findings. Replace <PR>
            with the PR NUMBER above.

            Triggering request (empty on INITIAL):
            ---
            ${{ github.event.comment.body || github.event.review.body }}
            ---

            If the request asks for a specific non-review task, do that instead.

            Prioritize correctness, regressions, security, authorization, customer PII,
            server-authoritative pricing, Convex validators and indexes, migration safety,
            i18n parity, and missing behavioral tests. Also flag structural complexity,
            misplaced ownership, unnecessary abstractions, and files pushed past a
            maintainable size. Ignore cosmetic issues covered by automated tooling.

            Report only findings with at least 80% confidence. Post one concise summary
            using `gh pr comment`; use inline comments for line-specific findings. If the
            PR is clean, say `Confidence: 5/5` and `No issues found.`
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"'
